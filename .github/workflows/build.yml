name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (leave empty for CI)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $version = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match buildspec.json version.' }
      - name: Cache dependency archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .deps/*.zip
            .deps/obs-studio-*/.deps/*.zip
          key: windows-sdk-${{ hashFiles('buildspec.json') }}
      - name: Build and test Debug
        run: ./scripts/build.ps1 -Configuration Debug
      - name: Build, test and package Release
        run: ./scripts/build.ps1 -Package
      - name: Verify HTTPS with packaged TLS backend
        run: |
          $qt = (Get-ChildItem .deps -Directory -Filter 'obs-deps-qt6-*-x64' | Select-Object -First 1).FullName
          $deps = (Get-ChildItem .deps -Directory -Filter 'obs-deps-*-x64' | Where-Object Name -NotLike '*qt6*' | Select-Object -First 1).FullName
          $env:PATH = "$pwd/.deps/bin/64bit;$qt/bin;$deps/bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$pwd/build_x64/installer-stage/obs-recording-actions/data/qt;$qt/plugins"
          & ./build_x64/Release/recording-actions-integration.exe --https-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Packaged HTTPS runtime verification failed.' }
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs
          path: build_x64/Testing/Temporary/*.log
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64
          path: dist
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*-setup.exe dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/*-setup.exe dist/SHA256SUMS.txt --verify-tag \
              --title "Recording Actions $RELEASE_TAG" \
              --notes-file "docs/release-notes/$RELEASE_TAG.md"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
